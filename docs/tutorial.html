<script>
  (()=>{
    const q=new URLSearchParams(location.search), el=document.querySelector('three-finger-demo');
    const theme=q.get('theme');
    if(['light','dark'].includes(theme)){document.documentElement.dataset.theme=theme;el.setAttribute('theme',theme);}
    if(q.get('embed')==='1'){document.documentElement.dataset.embed='true';el.setAttribute('compact','');}
    if(q.get('compact')==='1')el.setAttribute('compact','');
    if(q.has('scene'))el.setAttribute('scene',q.get('scene'));
    if(q.get('autoplay')==='0')el.setAttribute('autoplay','false');
    if(q.has('speed'))el.setAttribute('speed',q.get('speed'));
  })();
</script>

<div><strong>松手完成</strong><small lang="en">Lift to finish</small></div></div></div><footer class="foot"><span>动作示意 · 不会操作真实文件</span><div class="playback"><button type="button" class="tour-btn" aria-pressed="true" title="切换全部轮播 / 单场景循环"><span class="tiny-dot"></span><span class="tour-label">六个场景连播</span></button><span aria-hidden="true">·</span><button type="button" class="speed" title="切换演示速度" aria-label="演示速度：1 倍">1×</button></div></footer><p class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p></section>`;

      this.shadowRoot.querySelector('.replay-btn').addEventListener('click',()=>this.replay());
      this.shadowRoot.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>this.selectScene(btn.dataset.scene)));
      this.shadowRoot.querySelector('.tour-btn').addEventListener('click',()=>{

      });

        const rates=[.75,1,1.25,1.5,2,2.5,3];

        e.preventDefault();
        const n=e.key==='Home'?0:e.key==='End'?5:(this._scene+(e.key==='ArrowRight'?1:5))%6;
        this.selectScene(SCENES[n].id); this._els['tab-'+SCENES[n].id].focus();
      } else if(e.target.id==='demo-stage') {
        if(e.key===' '){e.preventDefault();this._playing?this.pause():this.play();}

      }
    }
    _activate() {
      const s=SCENES[this._scene];
      if(s.id==='text'){this._textWidth=this._els['selection-line'].getComputedTextLength();s.end[0]=76+this._textWidth;}
      SCENES.forEach((v,i)=>{

      });
      this._els['demo-stage'].setAttribute('aria-labelledby','tab-'+s.id);
      this.shadowRoot.querySelector('.scene-title').textContent=this.hasAttribute('compact')?'屏幕':s.title;
      this.shadowRoot.querySelector('.number').textContent=String(this._scene+1).padStart(2,'0')+' / 06';
      this._els['pointer-shape'].setAttribute('href','#pointer-'+s.cursor);
      this._activeProgress=this._els['tab-'+s.id].querySelector('.tab-progress');
    }
    _syncControls() {
      const btn=this.shadowRoot.querySelector('.pause-btn');
      const word=this._playing?'暂停演示':'继续演示';
      btn.innerHTML=icon(this._playing?'pause':'play');btn.title=word;btn.setAttribute('aria-label',word);
      this.shadowRoot.querySelector('.card').dataset.playing=String(this._playing);
      this.shadowRoot.querySelector('.tour-btn').setAttribute('aria-pressed',String(this._tour));
      this.shadowRoot.querySelector('.tour-label').textContent=this._tour?'六个场景连播':'当前场景循环';

      const drift=ramp(t,6.4,7.05);x+=16*drift;y+=17*drift;

    }

          const picked=122+337*p>cx-30 && 56+203*p>cy-9;

  customElements.define(TAG,ThreeFingerDemo);
})();
